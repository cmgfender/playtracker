name: CI / Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # test/*.test.js and test/suite/*.test.js; the browser UI tests skip (no Playwright here)
      - run: npm test

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Existing installs pull ghcr.io/cmgfender/playtracker: that image is built and pushed first,
      # on its own, so nothing about the new name can hold their updates back. The labels set here
      # override the Dockerfile's LABELs, so they carry the new name too.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cmgfender/playtracker
          labels: |
            org.opencontainers.image.title=Vestigo
            org.opencontainers.image.description=Vestigo Media Tracker (formerly PlayTracker) - self-hosted playtime and session tracker for Steam, Xbox and PlayStation
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the same image (same digest, every tag) under the new name ghcr.io/cmgfender/vestigo; a
      # failure here (e.g. the new package's permissions) never fails the build above
      - name: Copy to ghcr.io/cmgfender/vestigo
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker buildx imagetools create --tag "ghcr.io/cmgfender/vestigo:${t##*:}" "$t"; done

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vestigo</title>
  <meta name="description" content="Vestigo — self-hosted media tracker: playtime and sessions from Steam, Xbox and PlayStation">
  <meta name="application-name" content="Vestigo">
  <meta name="apple-mobile-web-app-title" content="Vestigo">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/app.css">
  <!-- before the first paint: theme, accent (the old default #7c5cff reads as #7656ff), its text ink and on-accent flag, layout -->
  <script>try{var d=document.documentElement,t=localStorage.getItem('pt-theme');if(t)d.dataset.theme=t;var a=localStorage.getItem('pt-accent');if(a)d.style.setProperty('--accent',a=='#7c5cff'?'#7656ff':a);var u=JSON.parse(localStorage.getItem('pt-ui')||'{}');for(var k in u)if(k=='ink')d.style.setProperty('--accent-ink',u[k]);else d.dataset[k]=u[k]}catch(e){}</script>
</head>
<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="vh" id="alerts" role="alert"></div>
  <noscript>Vestigo needs JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>

# Coming from the old `playtracker` service? Run `docker compose down` before switching to this
# file, and keep the same ./data folder: its playtracker.db is used in place (see README).
services:
  vestigo:
    image: ghcr.io/cmgfender/vestigo:latest
    # build: .
    container_name: vestigo
    restart: unless-stopped
    ports:
      - "7720:7720"
    volumes:
      - ./data:/data
    environment:
      TZ: America/New_York          # used for daily buckets and sync times
      PUID: 1000
      PGID: 1000
      # VESTIGO_PASSWORD: change-me      # optional UI/API password (or set it in Settings)
      # VESTIGO_SECURE_COOKIE: "true"    # when served over HTTPS via a reverse proxy
      # LOG_LEVEL: debug                 # debug | info | warn | error
      # VESTIGO_LOG_FILE: /data/vestigo.log
